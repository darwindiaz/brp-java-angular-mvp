server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 50m;

    location = /api/health {
        proxy_pass http://backend:8080/actuator/health;
    }

    location /api/ {
        proxy_pass http://backend:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
