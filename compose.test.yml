name: brp-catalog-tests

services:
  postgres-test:
    image: postgres:17
    command: ["postgres", "-c", "log_error_verbosity=terse", "-c", "log_parameter_max_length_on_error=0"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: "${BRP_TEST_ADMIN_PASSWORD:?Define BRP_TEST_ADMIN_PASSWORD}"
      BRP_TEST_DB_PASSWORD: "${BRP_TEST_DB_PASSWORD:?Define BRP_TEST_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${BRP_TEST_POSTGRES_PORT:-55433}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./backend/src/test/docker/init-postgres.sql:/docker-entrypoint-initdb.d/001-isolate-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$BRP_TEST_DB_PASSWORD\" psql -X -h 127.0.0.1 -U brp_test_catalog -d brp_test_catalog -Atqc 'select 1'"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_test_data:
