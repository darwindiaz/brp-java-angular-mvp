databaseChangeLog:
  - changeSet:
      id: 001-create-brp-catalog
      author: brp
      changes:
        - sqlFile:
            path: 001-create-brp-catalog.sql
            relativeToChangelogFile: true
  - changeSet:
      id: 002-load-brp-catalog
      author: brp
      runInTransaction: true
      changes:
        - sqlFile:
            path: 002-stage-brp-csv.sql
            relativeToChangelogFile: true
        - loadData:
            file: data/brp_ejemplo.csv
            relativeToChangelogFile: true
            tableName: brp_csv_stage
            encoding: UTF-8
            usePreparedStatements: true
        - sqlFile:
            path: 002-load-brp-catalog.sql
            relativeToChangelogFile: true
  - changeSet:
      id: 003-reject-blank-brp-identifiers
      author: brp
      changes:
        - sqlFile:
            path: 003-reject-blank-brp-identifiers.sql
            relativeToChangelogFile: true
  - changeSet:
      id: 004-create-identity
      author: brp
      changes:
        - sqlFile:
            path: 004-create-identity.sql
            relativeToChangelogFile: true
  - changeSet:
      id: 005-bootstrap-administrator
      author: brp
      runInTransaction: true
      changes:
        - customChange:
            class: co.brp.identity.infrastructure.BootstrapAdministrator
  - changeSet:
      id: 006-create-offers
      author: brp
      changes:
        - sqlFile:
            path: 006-create-offers.sql
            relativeToChangelogFile: true
  - changeSet:
      id: 007-offer-lifecycle
      author: brp
      changes:
        - sqlFile:
            path: 007-offer-lifecycle.sql
            relativeToChangelogFile: true
  - changeSet:
      id: 008-offer-attachments
      author: brp
      changes:
        - sqlFile:
            path: 008-offer-attachments.sql
            relativeToChangelogFile: true
